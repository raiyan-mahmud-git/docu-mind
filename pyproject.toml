[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "documind"
version = "0.1.0"
description = "A local-first document question-answering system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "pydantic>=2.8",
    "pymupdf>=1.24",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.2.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
documind = "documind.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/documind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/documind"]
warn_return_any = true
warn_unused_configs = true



